name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine requests beautifulsoup4 pillow pytz feedparser
          # Optional: install other requirements
          # pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile Severe-Weather-Network-expansion-W10.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colorado-Severe-Weather
          path: dist/*.exe
