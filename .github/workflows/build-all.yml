          name: macos-arm64-build
          path: ${{ env.APP_NAME }}-*-macos-arm64.dmg
          retention-days: 1
          
  # ============================================================================
  # LINUX BUILD
  # ============================================================================
  build-linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libfontconfig1 \
            libfreetype6 \
            libx11-6 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrender1 \
            libxrandr2 \
            libxss1 \
            libxtst6

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine requests beautifulsoup4 pillow pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🏗️ Build Application
        run: |
          if [ -f "main.py" ]; then
            MAIN_FILE="main.py"
          elif [ -f "app.py" ]; then
            MAIN_FILE="app.py"
          elif [ -f "Colorado-Severe-Weather.py" ]; then
            MAIN_FILE="Colorado-Severe-Weather.py"
          else
            echo "Creating placeholder main.py..."
            echo "print('CSWN Toolkit - Please add your main application code')" > main.py
            MAIN_FILE="main.py"
          fi
          
          echo "Building from: $MAIN_FILE"
          
          pyinstaller --noconfirm \
            --onefile \
            --windowed \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtGui \
            --hidden-import requests \
            --hidden-import beautifulsoup4 \
            --hidden-import PIL \
            --name "${APP_NAME}" \
            "$MAIN_FILE"

      - name: 📦 Create Linux Package
        run: |
          # Get version
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          
          echo "Creating Linux package for version: $VERSION"
          
          mkdir -p release
          
          # Copy executable
          if [ -f "dist/${APP_NAME}" ]; then
            cp "dist/${APP_NAME}" release/
            chmod +x "release/${APP_NAME}"
          fi
          
          # Create launch script
          cat > release/launch-cswn-toolkit.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          exec ./${APP_NAME} "$@"
          EOF
          chmod +x release/launch-cswn-toolkit.sh
          
          # Create README
          cat > release/README.txt << EOF
          CSWN Toolkit $VERSION - Linux
          =============================
          
          Colorado Severe Weather Network Toolkit
          Author: W5ALC (Jon.W5ALC@gmail.com)
          
          ## Installation
          1. Extract this archive to any folder
          2. Run: ./launch-cswn-toolkit.sh
          Or: ./${APP_NAME}
          
          ## System Requirements
          - Modern Linux distribution
          - X11 or Wayland display server
          - Network connection for weather data
          
          ## Features
          - Real-time Colorado weather alerts
          - NWS forecast discussions and outlooks
          - Live radar and satellite imagery
          - Skywarn and amateur radio resources
          - Fire, flood, and avalanche information
          
          ## Support
          Email: Jon.W5ALC@gmail.com
          GitHub: https://github.com/${{ github.repository }}
          
          Build: ${{ github.sha }}
          Date: $(date -u)
          EOF
          
          # Create tarball
          TAR_NAME="${APP_NAME}-${VERSION}-linux.tar.gz"
          tar -czf "$TAR_NAME" -C release .
          echo "Created: $TAR_NAME"

      - name: 📤 Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ env.APP_NAME }}-*.tar.gz
          retention-days: 1

  # ============================================================================
  # CREATE RELEASE
  # ============================================================================
  create-release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos-intel, build-macos-arm64, build-linux]
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📁 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 📋 List Downloaded Files
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts/ -type f -name "*" -exec ls -la {} \;

      - name: 📝 Generate Release Notes
        id: release_notes
        run: |
          # Get version
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          
          cat > RELEASE_NOTES.md << EOF
          # 🌪️ CSWN Toolkit $VERSION
          
          **Colorado Severe Weather Network Toolkit**  
          *Real-time weather monitoring for Colorado*
          
          **Author**: W5ALC (Jon.W5ALC@gmail.com)  
          **Version**: $VERSION  
          **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## 📦 Downloads
          
          Choose the appropriate package for your operating system:
          
          ### 🪟 Windows
          - **File**: \`${APP_NAME}-${VERSION}-windows.zip\`
          - **Requirements**: Windows 10 or later
          - **Installation**: Extract and run
          
          ### 🍎 macOS
          - **File**: \`${APP_NAME}-${VERSION}-macos.dmg\`
          - **Requirements**: macOS 10.15 (Catalina) or later
