name: CSWN Toolkit - Multi-Platform Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v2.2.0)'
        required: true
        default: 'v2.2.0'

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'CSWN-Toolkit'

jobs:
  # ============================================================================
  # WINDOWS BUILD
  # ============================================================================
  build-windows:
    name: 🪟 Build Windows
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine requests beautifulsoup4 pillow pyinstaller pytz
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: 🏗️ Build Application
        run: |
          $mainFile = "Severe-Weather-Network-expansion-W10.py"
          if (Test-Path "Severe-Weather-Network-expansion-W10.py") {
            $mainFile = "Severe-Weather-Network-expansion-W10.py"
          } elseif (Test-Path "app.py") {
            $mainFile = "app.py"
          } elseif (Test-Path "Colorado-Severe-Weather.py") {
            $mainFile = "Colorado-Severe-Weather.py"
          } else {
            Write-Host "Creating placeholder Severe-Weather-Network-expansion-W10.py..."
            "print('CSWN Toolkit - Please add your main application code')" | Out-File -FilePath "Severe-Weather-Network-expansion-W10.py" -Encoding UTF8
            $mainFile = "Severe-Weather-Network-expansion-W10.py"
          }
          
          Write-Host "Building from: $mainFile"
          
          pyinstaller --noconfirm `
            --onefile `
            --windowed `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtGui `
            --hidden-import requests `
            --hidden-import beautifulsoup4 `
            --hidden-import PIL `
            --name "${env:APP_NAME}" `
            $mainFile

      - name: 📦 Create Windows Package
        run: |
          # Get version
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          
          Write-Host "Creating Windows package for version: $version"
          
          New-Item -ItemType Directory -Force -Path "release"
          
          # Copy executable
          if (Test-Path "dist\${env:APP_NAME}.exe") {
            Copy-Item "dist\${env:APP_NAME}.exe" -Destination "release\"
          }
          
          # Create batch launcher
          @"
          @echo off
          title CSWN Toolkit
          cd /d "%~dp0"
          start "" "${env:APP_NAME}.exe"
          "@ | Out-File -FilePath "release\Launch-CSWN-Toolkit.bat" -Encoding ASCII
          
          # Create README
          @"
          CSWN Toolkit $version - Windows
          ==============================
          
          Colorado Severe Weather Network Toolkit
          Author: W5ALC (Jon.W5ALC@gmail.com)
          
          ## Installation
          1. Extract this ZIP file to any folder
          2. Run Launch-CSWN-Toolkit.bat or ${env:APP_NAME}.exe
          
          ## System Requirements
          - Windows 10 or later
          - Network connection for weather data
          
          ## Features
          - Real-time Colorado weather alerts
          - NWS forecast discussions and outlooks
          - Live radar and satellite imagery
          - Skywarn and amateur radio resources
          - Fire, flood, and avalanche information
          
          ## Support
          Email: Jon.W5ALC@gmail.com
          GitHub: https://github.com/${{ github.repository }}
          
          Build: ${{ github.sha }}
          Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          "@ | Out-File -FilePath "release\README.txt" -Encoding UTF8
          
          # Create ZIP package
          $zipName = "${env:APP_NAME}-$version-windows.zip"
          Compress-Archive -Path "release\*" -DestinationPath $zipName
          Write-Host "Created: $zipName"

      - name: 📤 Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.APP_NAME }}-*.zip
          retention-days: 1

# ============================================================================
  # MACOS BUILD - INTEL (x86_64)
  # ============================================================================
  build-macos-intel:
    name: 🍎 Build macOS Intel
    runs-on: macos-13  # Intel runner
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine requests beautifulsoup4 pillow pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🏗️ Build Application
        run: |
          if [ -f "Severe-Weather-Network-expansion-W10.py" ]; then
            MAIN_FILE="Severe-Weather-Network-expansion-W10.py"
          elif [ -f "app.py" ]; then
            MAIN_FILE="app.py"
          elif [ -f "Colorado-Severe-Weather.py" ]; then
            MAIN_FILE="Colorado-Severe-Weather.py"
          else
            echo "Creating placeholder Severe-Weather-Network-expansion-W10.py..."
            echo "print('CSWN Toolkit - Please add your main application code')" > Severe-Weather-Network-expansion-W10.py
            MAIN_FILE="Severe-Weather-Network-expansion-W10.py"
          fi
          
          echo "Building from: $MAIN_FILE"
          echo "Building for Intel x86_64 architecture"
          
          pyinstaller --noconfirm \
            --onefile \
            --windowed \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWebEngineWidgets \
            --hidden-import requests \
            --hidden-import beautifulsoup4 \
            --hidden-import PIL \
            --osx-bundle-identifier "com.w5alc.cswn-toolkit" \
            --name "${APP_NAME}-intel" \
            "$MAIN_FILE"

      - name: 📱 Create macOS App Bundle (Intel)
        run: |
          # Get version
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          
          echo "Creating macOS Intel app bundle for version: $VERSION"
          
          # Create app bundle structure
          mkdir -p "${APP_NAME}-intel.app/Contents/MacOS"
          mkdir -p "${APP_NAME}-intel.app/Contents/Resources"
          
          # Copy executable
          if [ -f "dist/${APP_NAME}-intel" ]; then
            cp "dist/${APP_NAME}-intel" "${APP_NAME}-intel.app/Contents/MacOS/"
            chmod +x "${APP_NAME}-intel.app/Contents/MacOS/${APP_NAME}-intel"
          fi
          
          # Create Info.plist
          cat > "${APP_NAME}-intel.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}-intel</string>
              <key>CFBundleIdentifier</key>
              <string>com.w5alc.cswn-toolkit</string>
              <key>CFBundleName</key>
              <string>CSWN Toolkit</string>
              <key>CFBundleDisplayName</key>
              <string>CSWN Toolkit (Intel)</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
              <key>NSRequiresAquaSystemAppearance</key>
              <false/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>NSMicrophoneUsageDescription</key>
              <string>This app may access the microphone for weather alerts.</string>
              <key>NSCameraUsageDescription</key>
              <string>This app may access the camera for weather documentation.</string>
              <key>NSLocationUsageDescription</key>
              <string>This app may access location for local weather information.</string>
              <key>NSAppleEventsUsageDescription</key>
              <string>This app may use Apple Events for integration with other applications.</string>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.weather</string>
              <key>LSArchitecturePriority</key>
              <array>
                  <string>x86_64</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: 💾 Create DMG Package (Intel)
        run: |
          # Get version
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          
          # Create DMG staging directory
          mkdir -p dmg_staging_intel
          
          # Copy app bundle
          if [ -d "${APP_NAME}-intel.app" ]; then
            cp -R "${APP_NAME}-intel.app" dmg_staging_intel/
          fi
          
          # Create Applications symlink
          ln -sf /Applications dmg_staging_intel/Applications
          
          # Create README
          cat > dmg_staging_intel/README.txt << EOF
          CSWN Toolkit $VERSION - macOS Intel
          ===================================
          
          Colorado Severe Weather Network Toolkit
          Author: W5ALC (Jon.W5ALC@gmail.com)
          
          ## Installation
          1. Drag ${APP_NAME}-intel.app to Applications folder
          2. Launch from Applications or Spotlight
          
          ## System Requirements
          - macOS 11.0 (Big Sur) or later
          - Intel x86_64 processor
          - Compatible with macOS 12.0-15.5+ (Monterey-Sequoia)
          - Network connection for weather data
          - Minimum 4GB RAM recommended
          
          ## Architecture
          This version is optimized for Intel Macs (x86_64).
          If you have an Apple Silicon Mac (M1/M2/M3), download the ARM64 version instead.
          
          ## First Launch
          - Right-click the app and select "Open" if blocked by Gatekeeper
          - Go to System Settings > Privacy & Security if needed
          - On macOS 13+ you may need to allow network access
          
          ## Features
          - Real-time Colorado weather alerts
          - NWS forecast discussions and outlooks  
          - Live radar and satellite imagery
          - Skywarn and amateur radio resources
          - Fire, flood, and avalanche information
          - Native macOS integration
          
          ## Troubleshooting
          - If app won't open: Check System Settings > Privacy & Security
          - If network issues: Allow network access in Security settings
          - For permission prompts: Grant access as needed
          
          ## Support
          Email: Jon.W5ALC@gmail.com
          GitHub: https://github.com/${{ github.repository }}
          
          Build: ${{ github.sha }}
          Date: $(date -u)
          Architecture: Intel x86_64
          Tested on: macOS 11.0-15.5
          EOF
          
          # Create DMG
          DMG_NAME="${APP_NAME}-${VERSION}-macos-intel.dmg"
          hdiutil create -volname "CSWN Toolkit $VERSION (Intel)" \
            -srcfolder dmg_staging_intel \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            "$DMG_NAME"
          
          echo "Created: $DMG_NAME"

      - name: 📤 Upload macOS Intel Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-build
          path: ${{ env.APP_NAME }}-*-macos-intel.dmg
          retention-days: 1

  # ============================================================================
  # MACOS BUILD - APPLE SILICON (ARM64)
  # ============================================================================
  build-macos-arm64:
    name: 🍎 Build macOS Apple Silicon
    runs-on: macos-latest  # Apple Silicon runner
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine requests beautifulsoup4 pillow pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🏗️ Build Application
        run: |
          if [ -f "Severe-Weather-Network-expansion-W10.py" ]; then
            MAIN_FILE="Severe-Weather-Network-expansion-W10.py"
          elif [ -f "app.py" ]; then
            MAIN_FILE="app.py"
          elif [ -f "Colorado-Severe-Weather.py" ]; then
            MAIN_FILE="Colorado-Severe-Weather.py"
          else
            echo "Creating placeholder Severe-Weather-Network-expansion-W10.py..."
            echo "print('CSWN Toolkit - Please add your main application code')" > Severe-Weather-Network-expansion-W10.py
            MAIN_FILE="Severe-Weather-Network-expansion-W10.py"
          fi
          
          echo "Building from: $MAIN_FILE"
          echo "Building for Apple Silicon ARM64 architecture"
          
          pyinstaller --noconfirm \
            --onefile \
            --windowed \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWebEngineWidgets \
            --hidden-import requests \
            --hidden-import beautifulsoup4 \
            --hidden-import PIL \
            --osx-bundle-identifier "com.w5alc.cswn-toolkit" \
            --name "${APP_NAME}-arm64" \
            "$MAIN_FILE"

      - name: 📱 Create macOS App Bundle (Apple Silicon)
        run: |
          # Get version
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          
          echo "Creating macOS Apple Silicon app bundle for version: $VERSION"
          
          # Create app bundle structure
          mkdir -p "${APP_NAME}-arm64.app/Contents/MacOS"
          mkdir -p "${APP_NAME}-arm64.app/Contents/Resources"
          
          # Copy executable
          if [ -f "dist/${APP_NAME}-arm64" ]; then
            cp "dist/${APP_NAME}-arm64" "${APP_NAME}-arm64.app/Contents/MacOS/"
            chmod +x "${APP_NAME}-arm64.app/Contents/MacOS/${APP_NAME}-arm64"
          fi
          
          # Create Info.plist
          cat > "${APP_NAME}-arm64.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}-arm64</string>
              <key>CFBundleIdentifier</key>
              <string>com.w5alc.cswn-toolkit</string>
              <key>CFBundleName</key>
              <string>CSWN Toolkit</string>
              <key>CFBundleDisplayName</key>
              <string>CSWN Toolkit (Apple Silicon)</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
              <key>NSRequiresAquaSystemAppearance</key>
              <false/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>NSMicrophoneUsageDescription</key>
              <string>This app may access the microphone for weather alerts.</string>
              <key>NSCameraUsageDescription</key>
              <string>This app may access the camera for weather documentation.</string>
              <key>NSLocationUsageDescription</key>
              <string>This app may access location for local weather information.</string>
              <key>NSAppleEventsUsageDescription</key>
              <string>This app may use Apple Events for integration with other applications.</string>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.weather</string>
              <key>LSArchitecturePriority</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: 💾 Create DMG Package (Apple Silicon)
        run: |
          # Get version
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          
          # Create DMG staging directory
          mkdir -p dmg_staging_arm64
          
          # Copy app bundle
          if [ -d "${APP_NAME}-arm64.app" ]; then
            cp -R "${APP_NAME}-arm64.app" dmg_staging_arm64/
          fi
          
          # Create Applications symlink
          ln -sf /Applications dmg_staging_arm64/Applications
          
          # Create README
          cat > dmg_staging_arm64/README.txt << EOF
          CSWN Toolkit $VERSION - macOS Apple Silicon
          ===========================================
          
          Colorado Severe Weather Network Toolkit
          Author: W5ALC (Jon.W5ALC@gmail.com)
          
          ## Installation
          1. Drag ${APP_NAME}-arm64.app to Applications folder
          2. Launch from Applications or Spotlight
          
          ## System Requirements
          - macOS 11.0 (Big Sur) or later
          - Apple Silicon processor (M1/M2/M3/M4)
          - Compatible with macOS 12.0-15.5+ (Monterey-Sequoia)
          - Network connection for weather data
          - Minimum 4GB RAM recommended
          
          ## Architecture
          This version is optimized for Apple Silicon Macs (ARM64).
          If you have an Intel Mac, download the Intel version instead.
          
          ## First Launch
          - Right-click the app and select "Open" if blocked by Gatekeeper
          - Go to System Settings > Privacy & Security if needed
          - On macOS 13+ you may need to allow network access
          
          ## Features
          - Real-time Colorado weather alerts
          - NWS forecast discussions and outlooks  
          - Live radar and satellite imagery
          - Skywarn and amateur radio resources
          - Fire, flood, and avalanche information
          - Native macOS integration
          - Optimized for Apple Silicon performance
          
          ## Troubleshooting
          - If app won't open: Check System Settings > Privacy & Security
          - If network issues: Allow network access in Security settings
          - For permission prompts: Grant access as needed
          
          ## Support
          Email: Jon.W5ALC@gmail.com
          GitHub: https://github.com/${{ github.repository }}
          
          Build: ${{ github.sha }}
          Date: $(date -u)
          Architecture: Apple Silicon ARM64
          Tested on: macOS 11.0-15.5
          EOF
          
          # Create DMG
          DMG_NAME="${APP_NAME}-${VERSION}-macos-arm64.dmg"
          hdiutil create -volname "CSWN Toolkit $VERSION (Apple Silicon)" \
            -srcfolder dmg_staging_arm64 \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            "$DMG_NAME"
          
          echo "Created: $DMG_NAME"

      - name: 📤 Upload macOS Apple Silicon Build
